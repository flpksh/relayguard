[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relayguard"
version = "0.2.0"
description = "Reliable webhook delivery and observability platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "asyncpg==0.32.0",
  "email-validator==2.3.0",
  "fastapi==0.162.0",
  "greenlet==3.5.6",
  "pydantic-settings==2.16.2",
  "psycopg2-binary==2.9.13",
  "PyJWT==2.15.1",
  "sqlalchemy==2.1.6",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
  "mypy==2.4.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["build", "dist", "backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
