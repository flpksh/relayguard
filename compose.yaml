services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relayguard}
      POSTGRES_USER: ${POSTGRES_USER:-relayguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relayguard}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relayguard} -d ${POSTGRES_DB:-relayguard}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    ports:
      - "${HOST_PORT:-8010}:${APP_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:$${APP_PORT}/health/live')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  quality:
    build:
      context: .
      target: development
    env_file: .env
    profiles: ["quality"]
    depends_on:
      db:
        condition: service_healthy
    command: pytest --cov=app --cov-report=term-missing

volumes:
  postgres_data:
