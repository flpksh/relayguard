services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    cpus: ${DB_CPUS:-1.0}
    mem_limit: ${DB_MEMORY:-512m}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relayguard}
      POSTGRES_USER: ${POSTGRES_USER:-relayguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relayguard}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relayguard} -d ${POSTGRES_DB:-relayguard}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    cpus: ${API_CPUS:-1.0}
    mem_limit: ${API_MEMORY:-512m}
    env_file: .env
    ports:
      - "${HOST_PORT:-8010}:${APP_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:$${APP_PORT}/health/live')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  db_test:
    image: postgres:17-alpine
    profiles: ["quality"]
    environment:
      POSTGRES_DB: relayguard_test
      POSTGRES_USER: relayguard
      POSTGRES_PASSWORD: relayguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayguard -d relayguard_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  quality:
    build:
      context: .
      target: development
    env_file: .env
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://relayguard:relayguard@db_test:5432/relayguard_test
    profiles: ["quality"]
    depends_on:
      db_test:
        condition: service_healthy
    command: sh -c "alembic upgrade head && pytest --cov=app --cov-report=term-missing"

volumes:
  postgres_data:
