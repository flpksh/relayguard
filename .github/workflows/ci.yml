name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relayguard
          POSTGRES_USER: relayguard
          POSTGRES_PASSWORD: relayguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayguard -d relayguard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://relayguard:relayguard@localhost:5432/relayguard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: docker build --check .
      - run: cp .env.example .env && docker compose config --quiet
